<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buku Order Pistachio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar pil di kiri, konten kartu membulat di kanan. Dashboard: kolom ringkasan pastel + grafik. */
:root{
  --bg:#E9E9EC; --panel:#DDDDE1; --surface:#FFFFFF; --line:#E4E4EA; --ink:#2B2B31; --muted:#82828C;
  --lime:#E6F970; --peach:#FFF2E2; --lav:#EFEAFF; --cyan:#E1F6F9;
  --c1:#E0892B; --c2:#7C5CE6; --c3:#14A6BA;
  --good:#22A05B; --warn:#B26F0B; --crit:#D2453B; --track:#ECECF0; --raisin:#7C5CE6; --accent:#2B2B31;
  --body:"Inter","Segoe UI",system-ui,sans-serif; --display:var(--body); --mono:var(--body);
  --r:22px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--body)}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;font-weight:600}
h1{font-size:26px;font-weight:500;letter-spacing:-.01em}
h2{font-size:18px;font-weight:500}
h3{font-size:15px;font-weight:500}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:12.5px;color:var(--muted);font-weight:500}

.shell{display:flex;gap:14px;max-width:1500px;margin:0 auto;padding:18px 16px 60px;align-items:flex-start}
.side{flex:0 0 206px;position:sticky;top:18px;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500;padding:6px 6px 2px}
.logo svg{width:34px;height:34px}
nav{display:flex;flex-direction:column;gap:8px}
nav button,.navbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:0;border-radius:999px;color:var(--ink);font:500 15px var(--body);padding:13px 18px;cursor:pointer}
nav button svg,.navbtn svg{width:19px;height:19px;flex:none;opacity:.75}
nav button:hover,.navbtn:hover{background:#D3D3D8}
nav button[aria-selected="true"]{background:var(--lime);font-weight:600}
nav button[aria-selected="true"] svg{opacity:1}
.content{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:4px 2px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
@media (max-width:860px){
  .shell{flex-direction:column;align-items:stretch}
  .side{position:static;flex:none;width:100%;gap:10px}
  nav{flex-direction:row;flex-wrap:wrap} nav button{width:auto;padding:10px 14px;font-size:14px}
  .navbtn{width:auto;align-self:flex-start;padding:8px 14px;font-size:14px}
}

button{font:500 14px var(--body);border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;cursor:pointer}
button:hover{border-color:#C9C9D1}
button.primary{background:var(--lime);border-color:transparent;color:var(--ink);font-weight:600}
button.primary:hover{filter:brightness(.96)}
button.danger{color:var(--crit)}
button.small{padding:5px 12px;font-size:13px}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
:focus-visible{outline:2px solid var(--c2);outline-offset:2px}

.section{display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.card{background:var(--surface);border-radius:var(--r);padding:20px 22px;min-width:0}
.cardhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}

/* dashboard */
.filter{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--surface);border-radius:var(--r);padding:12px 18px}
.filter .sp{flex:1}
.periode{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.periode label.f{width:150px}
.dash{display:grid;grid-template-columns:minmax(270px,330px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1080px){.dash{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border-radius:var(--r);padding:16px 0 0;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel>h2{padding:4px 16px 6px}
.fig{border-radius:var(--r);padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.fig.a{background:var(--peach)} .fig.b{background:var(--lav)} .fig.c{background:var(--cyan)}
.fig .h{display:flex;gap:14px;align-items:center;min-width:0}
.fig .ic{flex:none;width:50px;height:50px;border-radius:12px;display:grid;place-items:center}
.fig.a .ic{background:#FFE2BF;color:var(--c1)} .fig.b .ic{background:#DCD2FF;color:var(--c2)} .fig.c .ic{background:#C4EEF3;color:var(--c3)}
.fig .ic svg{width:26px;height:26px}
.fig .v{font-size:24px;font-weight:600;line-height:1.15;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.fig .d{font-size:13.5px;color:var(--muted)}
.fig .d b{font-weight:600} .fig .d b.up{color:var(--good)} .fig .d b.down{color:var(--crit)}
.stok{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:16px}
.gauge{display:flex;flex-direction:column;gap:7px;min-width:0}
.gauge .big{font-size:24px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.gauge .big small{font-size:13px;font-weight:400;color:var(--muted)}
.bar{position:relative;height:10px;border-radius:99px;background:var(--track)}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--c3)}
.bar.low i{background:var(--c1)} .bar.out i{background:var(--crit)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:2px}
.gauge .foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font-size:12.5px;color:var(--muted)}
.right{display:flex;flex-direction:column;gap:18px;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--ink)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart text{font:12px var(--body);fill:var(--muted)}
#ch-tip{position:absolute;top:6px;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:1.5;white-space:nowrap;z-index:2}
#ch-tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.donut{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center}
.donut svg{width:170px;height:170px;flex:none}
.donut .big{font:600 26px var(--body);fill:var(--ink)} .donut .sm{font:12px var(--body);fill:var(--muted)}
.dl{display:flex;flex-direction:column;gap:10px;font-size:13.5px;min-width:150px}
.dl div{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.dl i{width:10px;height:10px;border-radius:50%}
.blank{padding:34px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.src{font-size:13px;color:var(--muted)}

/* tabel */
.tablebox{overflow-x:auto;background:var(--surface);border-radius:var(--r);padding:6px 10px}
.card .tablebox{padding:0;border-radius:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:500;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
select.st{width:auto;min-width:100px;padding:5px 8px;font-size:13px;font-weight:600;border-color:currentColor;background:var(--surface);border-radius:999px}
select.st option{color:var(--ink)}
.st-lunas{color:var(--good)} .st-dp{color:var(--warn)} .st-belum{color:var(--ink)} .st-batal{color:var(--muted)}
tr.main td{border-bottom:0;padding-bottom:8px}
tr.sub td{padding-top:0}
.hist{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:#F4F4F7;border-radius:14px;padding:9px 14px}
.pay{display:inline-flex;gap:8px;align-items:center;font-size:13.5px}
.tot{font-size:13.5px;border-left:1px solid var(--line);padding-left:18px}
input.amt{width:128px;text-align:right;font-size:13.5px;padding:5px 8px}
input.paydate{width:auto;font-size:13px;padding:5px 8px}
input.note{min-width:110px;font-size:13.5px;padding:5px 8px}
tr.batal td{opacity:.55}
.empty{padding:30px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* form & dialog */
dialog{border:0;border-radius:var(--r);background:var(--surface);color:var(--ink);padding:0;width:min(700px,calc(100vw - 24px));max-height:calc(100dvh - 32px);box-shadow:0 20px 60px rgba(30,30,40,.25)}
dialog::backdrop{background:rgba(30,30,40,.45)}
.dlg{padding:24px;display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:14.5px var(--body);color:var(--ink);background:#F4F4F7;border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;min-width:0}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:520px){.item{grid-template-columns:1fr 1fr}}
.totalbar{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px}
.totalbar .v{font-size:22px;font-weight:600}
.err{color:var(--crit);font-size:13.5px} .hint{color:var(--warn);font-size:13.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.inv-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 24px;margin-left:auto;max-width:340px;width:100%}
.sum .t{font-weight:600;border-top:1px solid var(--line);padding-top:6px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;max-width:calc(100vw - 32px);z-index:10}
#login{max-width:390px;margin:12vh auto 0;display:flex;flex-direction:column;gap:16px;background:var(--surface);border-radius:var(--r);padding:28px}
#f-login{display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>

<section id="login" hidden>
  <div><h1>Buku Order Pistachio</h1><span class="muted">Masuk untuk membuka data order dan stok.</span></div>
  <form id="f-login">
    <label class="f">Email<input id="l-email" type="email" autocomplete="username" required></label>
    <label class="f">Password<input id="l-pass" type="password" autocomplete="current-password" required></label>
    <button class="primary">Masuk</button>
  </form>
  <div id="login-msg" class="err"></div>
</section>

<div class="shell" id="app" hidden>
  <aside class="side">
    <div class="logo"><svg viewBox="0 0 40 40" aria-hidden="true"><path fill="#2B2B31" d="M20 1l4.2 10.2L34 6l-5.2 9.8L39 20l-10.2 4.2L34 34l-9.8-5.2L20 39l-4.2-10.2L6 34l5.2-9.8L1 20l10.2-4.2L6 6l9.8 5.2z"/></svg><span>Buku Order</span></div>
    <nav role="tablist" id="tabs">
      <button role="tab" data-tab="ringkasan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>Dashboard</button>
      <button role="tab" data-tab="order"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Invoice &amp; order</button>
      <button role="tab" data-tab="stok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Stok &amp; harga</button>
      <button role="tab" data-tab="customer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.9.2 5 2.6 5 5.8"/></svg>Customer</button>
    </nav>
    <button class="navbtn" data-act="logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H5v16h5M15 8l4 4-4 4M9 12h10"/></svg>Keluar</button>
  </aside>
  <div class="content">
    <header class="top">
      <div class="brand"><h1 id="page-title">Selamat datang</h1><span class="muted" id="sub">Ini kondisi order, uang masuk, dan stok kamu.</span></div>
      <button class="primary" data-act="new-order" id="btn-new-order">+ Order baru</button>
    </header>
    <main id="view" class="section"><div class="card"><div class="empty">Memuat data…</div></div></main>
  </div>
</div>

<dialog id="dlg"><div class="dlg" id="dlg-body"></div></dialog>
<div id="toast" hidden role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ====== ISI DUA BARIS INI dari Supabase: Project Settings > API ====== */
const SUPABASE_URL = 'https://pmisaghjcagiuquhzrpj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_PUTAvyIUu2oSsMGe44jXZg_lrQgiHBs';
/* ===================================================================== */

/*LOGIC-START*/
function lineTotal(i){ return Math.round(i.qty * i.harga); }
function calc(S, today){
  const paid = {};
  const cnt = {};
  S.payments.forEach(p => { paid[p.orderId] = (paid[p.orderId] || 0) + p.jumlah; cnt[p.orderId] = (cnt[p.orderId] || 0) + 1; });
  const orders = S.orders.map(o => {
    const total = o.items.reduce((a, i) => a + lineTotal(i), 0);
    const dibayar = paid[o.id] || 0, sisa = total - dibayar;
    const auto = sisa <= 0 ? 'lunas' : (dibayar > 0 ? 'dp' : 'belum');
    const status = o.status === 'batal' ? 'batal' : auto;
    const telat = status !== 'batal' && status !== 'lunas' && sisa > 0 && !!o.jatuhTempo && o.jatuhTempo < today;
    return Object.assign({}, o, { total, dibayar, sisa, status, telat });
  }).sort((a, b) => b.tanggal.localeCompare(a.tanggal) || (b.createdAt || 0) - (a.createdAt || 0));
  const stok = {};
  S.products.forEach(p => { stok[p.id] = { masuk: 0, keluar: 0, sisa: 0 }; });
  S.stockin.forEach(s => { if (stok[s.productId]) stok[s.productId].masuk += s.qty; });
  S.orders.filter(o => o.status !== 'batal').forEach(o => o.items.forEach(i => { if (stok[i.productId]) stok[i.productId].keluar += i.qty; }));
  Object.values(stok).forEach(s => { s.sisa = Math.round((s.masuk - s.keluar) * 100) / 100; });
  const bulan = today.slice(0, 7);
  const aktif = orders.filter(o => o.status !== 'batal');
  const piutang = aktif.reduce((a, o) => a + Math.max(o.sisa, 0), 0);
  const omzet = aktif.filter(o => o.tanggal.slice(0, 7) === bulan).reduce((a, o) => a + o.total, 0);
  const masuk = S.payments.filter(p => p.tanggal.slice(0, 7) === bulan).reduce((a, p) => a + p.jumlah, 0);
  const perCust = {};
  aktif.forEach(o => {
    const c = perCust[o.customerId] || (perCust[o.customerId] = { order: 0, total: 0, sisa: 0 });
    c.order++; c.total += o.total; c.sisa += Math.max(o.sisa, 0);
  });
  return { orders, stok, piutang, omzet, masuk, perCust };
}
function nextInvoiceNo(orders, tanggal){
  const prefix = 'INV-' + tanggal.slice(2, 4) + tanggal.slice(5, 7) + '-';
  let max = 0;
  orders.forEach(o => { if ((o.no || '').startsWith(prefix)) max = Math.max(max, parseInt(o.no.slice(prefix.length), 10) || 0); });
  return prefix + String(max + 1).padStart(3, '0');
}
function jenisBayar(sudahDibayar, sisaSebelum, jumlah){
  if (jumlah >= sisaSebelum) return 'Pelunasan';
  return 'DP';
}
/*LOGIC-END*/

const COLS = ['products', 'customers', 'orders', 'payments', 'stockin'];
const S = { products: [], customers: [], orders: [], payments: [], stockin: [] };
let sb = null, toko = {}, ready = false, seq = 0, tab = 'ringkasan', openOrder = null;
const loaded = {};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
const kg = n => Number(n).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' kg';
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => iso(new Date());
const plusDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const tgl = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
const STATUS = { belum: 'Belum bayar', dp: 'DP', lunas: 'Lunas', batal: 'Batal' };
let pending = false;
const typing = sel => { const a = document.activeElement; return !!(a && a.matches && a.matches(sel)); };

function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3200); }
function fail(e){ console.error(e); toast('Gagal menyimpan' + (e && e.message ? ': ' + e.message : '. Coba sekali lagi.')); }

async function load(col){
  const { data, error } = await sb.from(col).select('*');
  if (error) throw error;
  S[col] = data || [];
}
async function loadAll(){
  await Promise.all(COLS.map(load));
  const r = await sb.from('settings').select('*').eq('id', 'toko').maybeSingle();
  toko = r.data || {};
  ready = true; render();
}
async function put(col, data, id){
  const q = id ? sb.from(col).update(data).eq('id', id) : sb.from(col).insert(data);
  const { data: row, error } = await q.select('id').single();
  if (error) throw error;
  await load(col); render();
  return row.id;
}
async function del(col, id){
  const { error } = await sb.from(col).delete().eq('id', id);
  if (error) throw error;
  await load(col); if (col === 'orders') await load('payments');
  render();
}
const strip = row => { const o = Object.assign({}, row); delete o.id; return o; };

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  $('page-title').textContent = { ringkasan: 'Selamat datang', order: 'Invoice & order status', stok: 'Stok & harga', customer: 'Customer' }[tab];
  $('sub').textContent = { ringkasan: 'Ini kondisi order, uang masuk, dan stok kamu.', order: 'Status pembayaran, riwayat bayar, dan invoice tiap order.', stok: 'Sisa stok per kg, harga jual, dan riwayat keluar masuk.', customer: 'Daftar customer dan sisa tagihannya.' }[tab];
  if (!ready) return;

  const C = calc(S, today());
  const v = $('view');
  if (!S.products.length){
    v.innerHTML = '<div class="card"><div class="empty"><h2>Belum ada produk</h2><span>Mulai dari produk dan stok awalnya. Setelah itu setiap order otomatis memotong stok dan membuat invoice.</span><button class="primary" data-act="new-product">+ Tambah produk</button></div></div>';
  } else if (typing('#view input.note, #view input.amt')) pending = true;

  y += 2; d.line(15, y, R, y); y += 6; d.setFont('helvetica', 'normal'); d.setFontSize(10);

  d.line(15, y - 2, R, y - 2); y += 4;
  [['Total', o.total], ['Sudah dibayar', o.dibayar], ['Sisa tagihan', Math.max(o.sisa, 0)]].forEach((r, n) => { if (n === 2) d.setFont('helvetica', 'bold'); d.text(r[0], 150, y, { align: 'right' }); d.text(rp(r[1]), R, y, { align: 'right' }); y += 6; });

/* status & note: satu sumber (dokumen order), dipakai tabel dan halaman invoice */
async function clearStatus(orderId){
  const raw = S.orders.find(x => x.id === orderId);
  if (!raw || !raw.status || raw.status === 'batal') return;
  await put('orders', { status: null }, orderId);
}
const findOrder = id => calc(S, today()).orders.find(x => x.id === id);
async function setStatus(id, val){
  let o = findOrder(id); const raw = S.orders.find(x => x.id === id);
  if (!o || !raw) return;
  if (val === 'batal'){ await put('orders', { status: 'batal' }, id); return toast('Order dibatalkan. Stok dikembalikan.'); }
  if (raw.status){ await put('orders', { status: null }, id); o = findOrder(id); }
  const ps = S.payments.filter(p => p.orderId === id);
  if (val === 'lunas'){
    if (o.sisa > 0){ await put('payments', { orderId: id, tanggal: today(), jumlah: o.sisa, jenis: 'Pelunasan', metode: 'Transfer' }); toast('Lunas. Sisa ' + rp(o.sisa) + ' dicatat sebagai pembayaran hari ini.'); }
  } else if (val === 'dp'){
    if (o.dibayar <= 0){
      toast('Isi nominal DP yang sudah diterima.'); render();
      const el = $('dlg').open ? $('p-jml') : document.querySelector('#view [data-paid="' + id + '"]');
      if (el){ el.focus(); if (el.select) el.select(); }
      return;
    }
    if (o.sisa <= 0){
      const auto = ps.filter(p => p.jenis === 'Pelunasan');
      if (auto.length && auto.length < ps.length){ for (const p of auto) await del('payments', p.id); toast('Pelunasan dihapus, tersisa pembayaran DP.'); }
      else toast('Pembayaran tercatat masih sama dengan total. Ubah nominalnya di kolom Sudah dibayar.');
    }
  } else if (val === 'belum' && ps.length) toast('Masih ada pembayaran tercatat. Isi 0 di kolom Sudah dibayar kalau memang belum bayar.');
  render();
}
/* Nominal: kolom "Sudah dibayar" = jumlah semua baris di Riwayat pembayaran. Status mengikuti angka ini. */
async function setPaid(id, x){
  const o = findOrder(id); if (!o) return;
  x = Math.max(0, Math.round(x || 0));
  if (x > o.total) x = o.total;
  const diff = x - o.dibayar;
  if (diff > 0) await put('payments', { orderId: id, tanggal: today(), jumlah: diff, jenis: x >= o.total ? 'Pelunasan' : 'DP', metode: 'Transfer' });
  else if (diff < 0){
    let c = -diff;
    for (const p of S.payments.filter(p => p.orderId === id).sort((a, b) => b.tanggal.localeCompare(a.tanggal))){
      if (c <= 0) break;
      if (p.jumlah <= c){ c -= p.jumlah; await del('payments', p.id); }
      else { await put('payments', { jumlah: p.jumlah - c, jenis: 'DP' }, p.id); c = 0; }
    }
  }
  toast('Sudah dibayar ' + rp(x) + ', kurang ' + rp(o.total - x) + '.'); render();
}
async function setPayAmt(pid, x){
  const p = S.payments.find(v => v.id === pid); if (!p) return;
  const o = findOrder(p.orderId); if (!o) return;
  x = Math.max(0, Math.round(x || 0));
  const lain = o.dibayar - p.jumlah;
  if (x > o.total - lain) x = o.total - lain;
  if (x <= 0) await del('payments', pid);
  else await put('payments', { jumlah: x, jenis: lain + x >= o.total ? 'Pelunasan' : 'DP' }, pid);
  toast('Sudah dibayar ' + rp(lain + x) + ', kurang ' + rp(o.total - lain - x) + '.'); render();
}
async function setNote(id, text){
  const raw = S.orders.find(x => x.id === id);
  if (!raw || (raw.catatan || '') === text) return;
  await put('orders', { catatan: text }, id);
  toast('Note tersimpan.');
}

/* ---------- events ---------- */
let armed = null;
document.addEventListener('click', async ev => {
  const tb = ev.target.closest('#tabs button');
  if (tb){ tab = tb.dataset.tab; try { history.replaceState(null, '', '#' + tab); } catch (e) {} return render(); }
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'open-order' && ev.target.closest('select,input')) return;
  if (el.dataset.confirm && armed !== el){ armed = el; el.dataset.label = el.textContent; el.textContent = el.dataset.confirm; setTimeout(() => { if (armed === el){ armed = null; if (el.isConnected) el.textContent = el.dataset.label; } }, 4000); return; }
  armed = null;
  try {
    if (act === 'close') closeDlg();
    else if (act === 'add-pay') {
      const o = findOrder(id), q = k => document.querySelector('#view [data-' + k + '="' + id + '"]');
      let amt = Math.round(parseFloat(q('newamt').value) || 0);
      if (!o || amt <= 0) toast('Isi nominalnya dulu.');
      else { if (amt > o.sisa) amt = o.sisa; await put('payments', { orderId: id, tanggal: q('newdate').value || today(), jumlah: amt, jenis: amt >= o.sisa ? 'Pelunasan' : 'DP', metode: 'Transfer' }); toast('Pembayaran ' + rp(amt) + ' tercatat.'); }
    }
    else if (act === 'per') {
      const n = new Date(), p = el.dataset.p;
      if (p === 'bulan') setPeriode(iso(new Date(n.getFullYear(), n.getMonth(), 1)), iso(new Date(n.getFullYear(), n.getMonth() + 1, 0)));
      else if (p === 'lalu') setPeriode(iso(new Date(n.getFullYear(), n.getMonth() - 1, 1)), iso(new Date(n.getFullYear(), n.getMonth(), 0)));
      else { const all = S.orders.map(o => o.tanggal).concat(S.payments.map(x => x.tanggal)).sort(); setPeriode(all[0] || today(), all.length && all[all.length - 1] > today() ? all[all.length - 1] : today()); }
    }
    else if (act === 'logout') { await sb.auth.signOut(); location.reload(); }
    else if (act === 'new-order') S.products.length ? orderForm() : productForm();
    else if (act === 'new-product') productForm();
    else if (act === 'edit-product') productForm(S.products.find(p => p.id === id));
    else if (act === 'stock-in') stockForm();
    else if (act === 'toko') tokoForm();
    else if (act === 'edit-customer') customerForm(S.customers.find(c => c.id === id));
    else if (act === 'add-item') { $('o-items').insertAdjacentHTML('beforeend', itemRow(document.querySelectorAll('#o-items .item').length)); }
    else if (act === 'rm-item') { if (document.querySelectorAll('#o-items .item').length > 1) el.closest('.item').remove(); recalcForm(); }
    else if (act === 'open-order') { openOrder = id; const o = calc(S, today()).orders.find(x => x.id === id); if (o) openDlg(orderDetail(o)); }
    else if (act === 'pdf') await savePdf(calc(S, today()).orders.find(x => x.id === id));
    else if (act === 'del-pay') { const p = S.payments.find(x => x.id === id); await del('payments', id); if (p) await clearStatus(p.orderId); }
    else if (act === 'del-stockin') await del('stockin', id);
    else if (act === 'del-order') { const ps = S.payments.filter(p => p.orderId === id).map(p => p.id); closeDlg(); for (const p of ps) await del('payments', p); await del('orders', id); toast('Order dihapus. Stok dikembalikan.'); }
    else if (act === 'wipe-contoh') { for (const c of COLS) for (const r of S[c].filter(x => x.contoh)) await del(c, r.id); toast('Data contoh dihapus.'); }
  } catch (e) { fail(e); }
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  if (ev.target.matches('tr.click')) ev.target.click();
  else if (ev.target.matches('input.amt[data-newamt]')) { ev.preventDefault(); const b = ev.target.parentElement.querySelector('[data-act="add-pay"]'); ev.target.blur(); if (b) b.click(); }
  else if (ev.target.matches('#view input.amt, input.note')) ev.target.blur();
});
document.addEventListener('input', ev => { if (ev.target.closest('#o-items')) recalcForm(); });
document.addEventListener('change', ev => {
  const sel = ev.target.closest('#o-items select'); if (!sel) return;
  const p = S.products.find(x => x.id === sel.value); if (p) sel.closest('.item').querySelector('[data-k="harga"]').value = p.harga; recalcForm();
});
document.addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = ev.target, btn = f.querySelector('button.primary'); if (btn.disabled) return; btn.disabled = true;
  try {
    if (f.id === 'f-login') {
      $('login-msg').textContent = '';
      const r = await sb.auth.signInWithPassword({ email: $('l-email').value.trim(), password: $('l-pass').value });
      if (r.error) $('login-msg').textContent = 'Email atau password salah.'; else await enter();
    }
    else if (f.id === 'f-order') await saveOrder();
    else if (f.id === 'f-pay') {
      const o = calc(S, today()).orders.find(x => x.id === f.dataset.id), jumlah = Math.round(parseFloat($('p-jml').value) || 0);
      if (o && jumlah > 0) { await put('payments', { orderId: o.id, tanggal: $('p-tgl').value, jumlah, jenis: jenisBayar(o.dibayar, o.sisa, jumlah), metode: $('p-metode').value }); await clearStatus(o.id); toast('Pembayaran ' + rp(jumlah) + ' tercatat.'); }
    }
    else if (f.id === 'f-product') {
      const old = S.products.find(p => p.id === f.dataset.id);
      const data = Object.assign(old ? strip(old) : {}, { nama: $('pr-nama').value.trim(), harga: Math.round(parseFloat($('pr-harga').value) || 0), minStok: parseFloat($('pr-min').value) || 0 });
      const pid = await put('products', data, old ? old.id : undefined);
      const awal = $('pr-awal') ? parseFloat($('pr-awal').value) || 0 : 0;
      if (awal > 0) await put('stockin', { productId: pid, tanggal: today(), qty: awal, catatan: 'Stok awal' });
      closeDlg(); toast('Produk tersimpan.');
    }
    else if (f.id === 'f-stock') { await put('stockin', { productId: $('s-prod').value, tanggal: $('s-tgl').value, qty: parseFloat($('s-qty').value) || 0, catatan: $('s-cat').value.trim() || 'Barang masuk' }); closeDlg(); toast('Stok bertambah.'); }
    else if (f.id === 'f-customer') { const c = S.customers.find(x => x.id === f.dataset.id); await put('customers', Object.assign(strip(c), { nama: $('c-nama').value.trim(), telp: $('c-telp').value.trim() }), c.id); closeDlg(); toast('Customer tersimpan.'); }
    else if (f.id === 'f-toko') { toko = { nama: $('t-nama').value.trim(), alamat: $('t-alamat').value.trim(), bayar: $('t-bayar').value.trim() }; const r = await sb.from('settings').upsert(Object.assign({ id: 'toko' }, toko)); if (r.error) throw r.error; closeDlg(); toast('Data toko tersimpan.'); }
  } catch (e) { fail(e); }
  if (btn.isConnected) btn.disabled = false;
});

/* ---------- start ---------- */
async function enter(){
  $('login').hidden = true; $('app').hidden = false;
  try { await loadAll(); }
  catch (e) { $('view').innerHTML = '<div class="tablebox"><div class="empty">Data tidak bisa dimuat: ' + esc(e.message || '') + '<br>Pastikan schema.sql sudah dijalankan di Supabase.</div></div>'; }
}
(async function start(){
  const h = location.hash.slice(1); if (['ringkasan', 'order', 'stok', 'customer'].includes(h)) tab = h;
  if (!window.supabase || SUPABASE_URL.indexOf('ISI_') === 0){
    $('login').hidden = false; $('f-login').hidden = true;
    $('login-msg').textContent = window.supabase ? 'Supabase belum dihubungkan. Isi SUPABASE_URL dan SUPABASE_ANON_KEY di file index.html.' : 'Library Supabase gagal dimuat. Cek koneksi internet lalu muat ulang.';
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data } = await sb.auth.getSession();
  if (data && data.session) enter(); else $('login').hidden = false;
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && ready && !$('dlg').open && !typing('input,select,textarea')) loadAll().catch(() => {});
  });
})();
</script>
