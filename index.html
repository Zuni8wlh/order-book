<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buku Order Pistachio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: buku kas satu kolom. Takaran stok per kg di paling atas, lalu angka uang, lalu tabel tagihan. Order adalah satu-satunya pintu input. */
:root{
  --bg:#ECEFE4; --surface:#F9FAF5; --line:#D3D9C6; --ink:#2B2230; --muted:#6C6672;
  --accent:#55772A; --accent-ink:#FFFFFF; --raisin:#6E2C4B;
  --good:#2F7A4A; --warn:#A8690B; --crit:#B3382F; --track:#DDE3CF;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1B191F; --surface:#25222B; --line:#3B3743; --ink:#ECEDE3; --muted:#A39DAA;
  --accent:#A6C36A; --accent-ink:#1B191F; --raisin:#D58CAE;
  --good:#7CCB96; --warn:#E3B052; --crit:#F08379; --track:#34303C; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1B191F; --surface:#25222B; --line:#3B3743; --ink:#ECEDE3; --muted:#A39DAA;
  --accent:#A6C36A; --accent-ink:#1B191F; --raisin:#D58CAE;
  --good:#7CCB96; --warn:#E3B052; --crit:#F08379; --track:#34303C; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light dark}
body{margin:0}
#login{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}
#f-login{display:flex;flex-direction:column;gap:12px}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:20px 64px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700}
h3{font-size:15px;font-weight:500}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
nav{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:500 15px var(--body);padding:10px 14px;cursor:pointer;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

button,.btn{font:500 14px var(--body);border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.danger{color:var(--crit)}
button.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font-weight:500}
button.small{padding:4px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.notice{border:1px dashed var(--raisin);border-radius:6px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;color:var(--ink)}
.notice strong{color:var(--raisin)}

.section{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

/* takaran stok */
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.gauge .big{font:500 30px/1 var(--mono);font-variant-numeric:tabular-nums}
.gauge .big small{font-size:14px;color:var(--muted)}
.bar{position:relative;height:14px;border-radius:3px;background:var(--track);overflow:visible}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--accent)}
.bar.low i{background:var(--warn)} .bar.out i{background:var(--crit)}
.bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.gauge .foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:13px;color:var(--muted)}

.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border-block:1px solid var(--line)}
.fig{padding:14px 16px 14px 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.fig .v{font:500 21px var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--bg)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
select.st{width:auto;min-width:100px;padding:5px 8px;font-size:13px;font-weight:600;border-color:currentColor;background:var(--surface)}
select.st option{color:var(--ink)}
.st-lunas{color:var(--good)} .st-dp,.st-cicilan{color:var(--warn)} .st-belum{color:var(--ink)} .st-batal{color:var(--muted)}
tr.main td{border-bottom:0;padding-bottom:8px}
tr.sub td{padding-top:0}
.hist{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--bg);border-radius:6px;padding:8px 12px}
.pay{display:inline-flex;gap:8px;align-items:center;font-size:13.5px}
.tot{font-size:13.5px;border-left:1px solid var(--line);padding-left:18px}
input.paydate{width:auto;font-size:13px;padding:5px 8px}
.periode{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.periode label.f{width:150px}
.src{font-size:13px;color:var(--muted)}
input.note{min-width:110px;font-size:13.5px;padding:5px 8px}
tr.batal td{opacity:.6}
tr.click:hover + tr.sub td{background:transparent}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(20,16,24,.55)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input.num{font-family:var(--mono)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:520px){.item{grid-template-columns:1fr 1fr}}
.totalbar{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px}
.totalbar .v{font:500 22px var(--mono)}
.err{color:var(--crit);font-size:13.5px} .hint{color:var(--warn);font-size:13.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.inv-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 24px;justify-content:end;margin-left:auto;max-width:340px;width:100%}
.sum .t{font-weight:600;border-top:1px solid var(--line);padding-top:6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;max-width:calc(100vw - 32px)}
</style>
</head>
<body>

<section id="login" hidden>
  <div><h1>Buku Order Pistachio</h1><span class="muted">Masuk untuk membuka data order dan stok.</span></div>
  <form id="f-login">
    <label class="f">Email<input id="l-email" type="email" autocomplete="username" required></label>
    <label class="f">Password<input id="l-pass" type="password" autocomplete="current-password" required></label>
    <button class="primary">Masuk</button>
  </form>
  <div id="login-msg" class="err"></div>
</section>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="brand">
      <h1>Buku Order Pistachio</h1>
      <span class="muted" id="sub">Pistachio dan raisins, semua dihitung per kg</span>
    </div>
    <div class="actions"><button data-act="logout">Keluar</button><button class="primary" data-act="new-order" id="btn-new-order">+ Order baru</button></div>
  </header>

  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="ringkasan">Ringkasan</button>
    <button role="tab" data-tab="order">Invoice &amp; order status</button>
    <button role="tab" data-tab="stok">Stok &amp; harga</button>
    <button role="tab" data-tab="customer">Customer</button>
  </nav>

  <div id="notice" class="notice" hidden></div>
  <main id="view" class="section"><div class="empty">Memuat data…</div></main>
</div>

<dialog id="dlg"><div class="dlg" id="dlg-body"></div></dialog>
<div id="toast" hidden role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ====== ISI DUA BARIS INI dari Supabase: Project Settings > API ====== */
const SUPABASE_URL = 'https://pmisaghjcagiuquhzrpj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_PUTAvyIUu2oSsMGe44jXZg_lrQgiHBs';
/* ===================================================================== */

/*LOGIC-START*/
function lineTotal(i){ return Math.round(i.qty * i.harga); }
function calc(S, today){
  const paid = {};
  const cnt = {};
  S.payments.forEach(p => { paid[p.orderId] = (paid[p.orderId] || 0) + p.jumlah; cnt[p.orderId] = (cnt[p.orderId] || 0) + 1; });
  const orders = S.orders.map(o => {
    const total = o.items.reduce((a, i) => a + lineTotal(i), 0);
    const dibayar = paid[o.id] || 0, sisa = total - dibayar;
    const auto = sisa <= 0 ? 'lunas' : (dibayar > 0 ? 'dp' : 'belum');
    const status = (o.status === 'cicilan' ? 'dp' : o.status) || auto;
    const telat = status !== 'batal' && status !== 'lunas' && sisa > 0 && !!o.jatuhTempo && o.jatuhTempo < today;
    return Object.assign({}, o, { total, dibayar, sisa, status, telat });
  }).sort((a, b) => b.tanggal.localeCompare(a.tanggal) || (b.createdAt || 0) - (a.createdAt || 0));
  const stok = {};
  S.products.forEach(p => { stok[p.id] = { masuk: 0, keluar: 0, sisa: 0 }; });
  S.stockin.forEach(s => { if (stok[s.productId]) stok[s.productId].masuk += s.qty; });
  S.orders.filter(o => o.status !== 'batal').forEach(o => o.items.forEach(i => { if (stok[i.productId]) stok[i.productId].keluar += i.qty; }));
  Object.values(stok).forEach(s => { s.sisa = Math.round((s.masuk - s.keluar) * 100) / 100; });
  const bulan = today.slice(0, 7);
  const aktif = orders.filter(o => o.status !== 'batal');
  const piutang = aktif.reduce((a, o) => a + Math.max(o.sisa, 0), 0);
  const omzet = aktif.filter(o => o.tanggal.slice(0, 7) === bulan).reduce((a, o) => a + o.total, 0);
  const masuk = S.payments.filter(p => p.tanggal.slice(0, 7) === bulan).reduce((a, p) => a + p.jumlah, 0);
  const perCust = {};
  aktif.forEach(o => {
    const c = perCust[o.customerId] || (perCust[o.customerId] = { order: 0, total: 0, sisa: 0 });
    c.order++; c.total += o.total; c.sisa += Math.max(o.sisa, 0);
  });
  return { orders, stok, piutang, omzet, masuk, perCust };
}
function nextInvoiceNo(orders, tanggal){
  const prefix = 'INV-' + tanggal.slice(2, 4) + tanggal.slice(5, 7) + '-';
  let max = 0;
  orders.forEach(o => { if ((o.no || '').startsWith(prefix)) max = Math.max(max, parseInt(o.no.slice(prefix.length), 10) || 0); });
  return prefix + String(max + 1).padStart(3, '0');
}
function jenisBayar(sudahDibayar, sisaSebelum, jumlah){
  if (jumlah >= sisaSebelum) return 'Pelunasan';
  return 'DP';
}
/*LOGIC-END*/

const COLS = ['products', 'customers', 'orders', 'payments', 'stockin'];
const S = { products: [], customers: [], orders: [], payments: [], stockin: [] };
let sb = null, toko = {}, ready = false, seq = 0, tab = 'ringkasan', openOrder = null;
const loaded = {};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
const kg = n => Number(n).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' kg';
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => iso(new Date());
const plusDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const tgl = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
const STATUS = { belum: 'Belum bayar', dp: 'DP', lunas: 'Lunas', batal: 'Batal' };
let pending = false;
const typing = sel => { const a = document.activeElement; return !!(a && a.matches && a.matches(sel)); };

function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3200); }
function fail(e){ console.error(e); toast('Gagal menyimpan' + (e && e.message ? ': ' + e.message : '. Coba sekali lagi.')); }

async function load(col){
  const { data, error } = await sb.from(col).select('*');
  if (error) throw error;
  S[col] = data || [];
}
async function loadAll(){
  await Promise.all(COLS.map(load));
  const r = await sb.from('settings').select('*').eq('id', 'toko').maybeSingle();
  toko = r.data || {};
  ready = true; render();
}
async function put(col, data, id){
  const q = id ? sb.from(col).update(data).eq('id', id) : sb.from(col).insert(data);
  const { data: row, error } = await q.select('id').single();
  if (error) throw error;
  await load(col); render();
  return row.id;
}
async function del(col, id){
  const { error } = await sb.from(col).delete().eq('id', id);
  if (error) throw error;
  await load(col); if (col === 'orders') await load('payments');
  render();
}
const strip = row => { const o = Object.assign({}, row); delete o.id; return o; };

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  if (!ready) return;

  const C = calc(S, today());
  const v = $('view');
  if (!S.products.length){
    v.innerHTML = '<div class="tablebox"><div class="empty"><h2>Belum ada produk</h2><span>Mulai dari produk dan stok awalnya. Setelah itu setiap order otomatis memotong stok dan membuat invoice.</span><button class="primary" data-act="new-product">+ Tambah produk</button></div></div>';
  } else if (typing('#view input.note')) pending = true;
  else v.innerHTML = ({ ringkasan: vRingkasan, order: vOrder, stok: vStok, customer: vCustomer })[tab](C);
  if (openOrder && $('dlg').open){ const o = C.orders.find(x => x.id === openOrder); if (!o) closeDlg(); else if (typing('#dlg input.note')) pending = true; else $('dlg-body').innerHTML = orderDetail(o); }
}

function gauge(p, s){
  const min = p.minStok || 0, scale = Math.max(s.masuk, min * 1.5, 1);
  const pct = Math.max(0, Math.min(100, s.sisa / scale * 100));
  const cls = s.sisa <= 0 ? 'out' : (s.sisa < min ? 'low' : '');
  const note = s.sisa <= 0 ? '<span style="color:var(--crit)">Stok habis</span>' : (s.sisa < min ? '<span style="color:var(--warn)">Di bawah batas ' + kg(min) + '</span>' : 'Batas minimum ' + kg(min));
  return '<div class="gauge"><div class="row"><h3>' + esc(p.nama) + '</h3><span class="num muted">' + rp(p.harga) + '/kg</span></div>' +
    '<div class="big">' + Number(s.sisa).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' <small>kg tersisa</small></div>' +
    '<div class="bar ' + cls + '"><i style="width:' + pct + '%"></i>' + (min ? '<b style="left:' + Math.min(100, min / scale * 100) + '%" title="Batas minimum"></b>' : '') + '</div>' +
    '<div class="foot"><span>' + note + '</span><span class="num">masuk ' + kg(s.masuk) + ' · terjual ' + kg(s.keluar) + '</span></div></div>';
}
function statusSelect(o, pre){
  return '<select id="' + pre + '-st-' + o.id + '" class="st st-' + o.status + '" data-status="' + o.id + '" aria-label="Status pembayaran">' + Object.keys(STATUS).map(k => '<option value="' + k + '"' + (k === o.status ? ' selected' : '') + '>' + STATUS[k] + '</option>').join('') + '</select>';
}
function noteInput(o, pre){ return '<input id="' + pre + '-note-' + o.id + '" class="note" data-note="' + o.id + '" value="' + esc(o.catatan || '') + '" placeholder="Tulis note" aria-label="Note" autocomplete="off">'; }
const jn = j => j === 'Cicilan' ? 'DP' : (j || '');
function payHistory(o){
  const ps = S.payments.filter(p => p.orderId === o.id).sort((a, b) => a.tanggal.localeCompare(b.tanggal));
  const list = ps.length ? ps.map(p => '<span class="pay"><input type="date" class="paydate" id="t-pd-' + p.id + '" data-paydate="' + p.id + '" value="' + esc(p.tanggal) + '" aria-label="Tanggal bayar"><span>' + esc(jn(p.jenis)) + '</span><strong class="num">' + rp(p.jumlah) + '</strong></span>').join('') : '<span class="muted">Belum ada pembayaran</span>';
  const kurang = o.status === 'batal' ? 0 : Math.max(o.sisa, 0);
  return '<div class="hist"><span class="label">Riwayat pembayaran</span>' + list + '<span class="tot">Sudah dibayar <strong class="num">' + rp(o.dibayar) + '</strong> · Kurang <strong class="num" style="color:var(' + (kurang > 0 ? '--crit' : '--good') + ')">' + rp(kurang) + '</strong></span></div>';
}
function orderRows(list){
  return list.map(o => { const b = o.status === 'batal' ? ' batal' : ''; return '<tr class="click main' + b + '" data-act="open-order" data-id="' + o.id + '" tabindex="0"><td style="white-space:nowrap"><span class="num">' + esc(o.no) + '</span><br><button class="small primary" style="margin-top:6px" data-act="open-order" data-id="' + o.id + '">Buka invoice</button></td><td>' + esc(o.customerName) + '<br><span class="muted">' + o.items.map(i => esc(i.nama) + ' ' + kg(i.qty)).join(', ') + '</span></td><td>' + tgl(o.tanggal) + '<br><span class="muted">tempo ' + tgl(o.jatuhTempo) + '</span>' + (o.telat ? '<br><span style="color:var(--crit)">lewat jatuh tempo</span>' : '') + '</td><td class="r num">' + rp(o.total) + '</td><td class="r num">' + rp(o.dibayar) + '</td><td class="r num">' + rp(o.status === 'batal' ? 0 : Math.max(o.sisa, 0)) + '</td><td>' + statusSelect(o, 't') + '</td><td>' + noteInput(o, 't') + '</td></tr>' +
    '<tr class="sub' + b + '"><td colspan="8">' + payHistory(o) + '</td></tr>'; }).join('');
}
const orderHead = '<tr><th>No. invoice</th><th>Customer / barang</th><th>Tanggal order</th><th class="r">Total</th><th class="r">Sudah dibayar</th><th class="r">Kurang</th><th>Status pembayaran</th><th>Note</th></tr>';

let pFrom = '', pTo = '';
try { const s = JSON.parse(localStorage.getItem('periode') || '{}'); pFrom = s.f || ''; pTo = s.t || ''; } catch (e) {}
function setPeriode(f, t){ pFrom = f || ''; pTo = t || ''; try { localStorage.setItem('periode', JSON.stringify({ f: pFrom, t: pTo })); } catch (e) {} render(); }
function vRingkasan(C){
  const open = C.orders.filter(o => o.sisa > 0 && o.status !== 'batal').sort((a, b) => (a.jatuhTempo || '9').localeCompare(b.jatuhTempo || '9'));

function readItems(){

function recalcForm(){
  if (!$('o-total')) return;
  const items = readItems(), C = calc(S, today());
  $('o-total').textContent = rp(items.reduce((a, i) => a + lineTotal(i), 0));
  const need = {}; items.forEach(i => { need[i.productId] = (need[i.productId] || 0) + i.qty; });
  $('o-warn').textContent = Object.keys(need).filter(id => C.stok[id] && need[id] > C.stok[id].sisa).map(id => 'Stok ' + (S.products.find(p => p.id === id) || {}).nama + ' tinggal ' + kg(C.stok[id].sisa) + ', order ini butuh ' + kg(need[id]) + '. Stok akan tercatat minus.').join(' ');

async function saveOrder(){
  const items = readItems().filter(i => i.qty > 0), nama = $('o-cust').value.trim(), tanggal = $('o-tgl').value;
  const total = items.reduce((a, i) => a + lineTotal(i), 0), dp = Math.round(parseFloat($('o-dp').value) || 0);
  if (!items.length) return void ($('o-err').textContent = 'Isi minimal satu barang dengan qty lebih dari 0.');
  if (dp > total) return void ($('o-err').textContent = 'DP lebih besar dari total order (' + rp(total) + ').');
  let c = S.customers.find(x => x.nama.toLowerCase() === nama.toLowerCase());
  const customerId = c ? c.id : await put('customers', { nama, telp: '' });
  const no = nextInvoiceNo(S.orders, tanggal);
  const id = await put('orders', { no, tanggal, jatuhTempo: $('o-tempo').value, customerId, customerName: c ? c.nama : nama, items, catatan: $('o-cat').value.trim(), createdAt: Date.now() });
  if (dp > 0) await put('payments', { orderId: id, tanggal, jumlah: dp, jenis: jenisBayar(0, total, dp), metode: $('o-metode').value });
  toast('Order ' + no + ' tersimpan. Stok dan tagihan sudah diperbarui.');
  for (let i = 0; i < 30 && !S.orders.some(x => x.id === id); i++) await new Promise(r => setTimeout(r, 100));
  tab = 'order';
  if (S.orders.some(x => x.id === id)) { openOrder = id; render(); } else { closeDlg(); render(); }
}

async function savePdf(o){
  if (!o) return;
  if (!window.jspdf) return void toast('Library PDF gagal dimuat. Cek koneksi internet lalu muat ulang.');
  const d = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' }), R = 195; let y = 22;
  d.setFont('helvetica', 'bold'); d.setFontSize(18); d.text(toko.nama || 'INVOICE', 15, y);
  d.setFontSize(11); d.text(o.no, R, y, { align: 'right' });
  d.setFont('helvetica', 'normal'); d.setFontSize(10); y += 6;
  if (toko.alamat) d.text(String(toko.alamat), 15, y);
  d.text('Tanggal: ' + tgl(o.tanggal), R, y, { align: 'right' }); y += 5;
  d.text('Jatuh tempo: ' + tgl(o.jatuhTempo), R, y, { align: 'right' }); y += 10;
  d.text('Kepada:', 15, y); d.setFont('helvetica', 'bold'); d.text(String(o.customerName), 32, y); y += 10;
  d.setFontSize(9); d.text('BARANG', 15, y); d.text('QTY', 110, y, { align: 'right' }); d.text('HARGA / KG', 150, y, { align: 'right' }); d.text('JUMLAH', R, y, { align: 'right' });
  y += 2; d.line(15, y, R, y); y += 6; d.setFont('helvetica', 'normal'); d.setFontSize(10);
  o.items.forEach(i => { d.text(String(i.nama), 15, y); d.text(kg(i.qty), 110, y, { align: 'right' }); d.text(rp(i.harga), 150, y, { align: 'right' }); d.text(rp(lineTotal(i)), R, y, { align: 'right' }); y += 6; });
  d.line(15, y - 2, R, y - 2); y += 4;
  [['Total', o.total], ['Sudah dibayar', o.dibayar], ['Sisa tagihan', Math.max(o.sisa, 0)]].forEach((r, n) => { if (n === 2) d.setFont('helvetica', 'bold'); d.text(r[0], 150, y, { align: 'right' }); d.text(rp(r[1]), R, y, { align: 'right' }); y += 6; });
  d.setFont('helvetica', 'normal'); y += 4;
  if (toko.bayar) { d.text('Pembayaran: ' + toko.bayar, 15, y); y += 6; }
  d.text('Status: ' + STATUS[o.status], 15, y); y += 6;
  if (o.catatan) d.text('Note: ' + o.catatan, 15, y);
  d.save(o.no + '.pdf'); toast('Invoice ' + o.no + ' diunduh.');
}

/* status & note: satu sumber (dokumen order), dipakai tabel dan halaman invoice */
async function clearStatus(orderId){
  const raw = S.orders.find(x => x.id === orderId);
  if (!raw || !raw.status || raw.status === 'batal') return;
  await put('orders', { status: null }, orderId);
}
async function setStatus(id, val){
  const o = calc(S, today()).orders.find(x => x.id === id), raw = S.orders.find(x => x.id === id);
  if (!o || !raw) return;
  if (val === 'lunas' && o.sisa > 0){
    await put('payments', { orderId: id, tanggal: today(), jumlah: o.sisa, jenis: 'Pelunasan', metode: 'Transfer' });
    await put('orders', { status: null }, id);
    toast('Lunas. Sisa ' + rp(o.sisa) + ' dicatat sebagai pelunasan.');
  } else {
    await put('orders', { status: val }, id);
    toast(val === 'batal' ? 'Order dibatalkan. Stok dikembalikan.' : 'Status diubah ke ' + STATUS[val] + '.');
  }
}
async function setNote(id, text){
  const raw = S.orders.find(x => x.id === id);
  if (!raw || (raw.catatan || '') === text) return;
  await put('orders', { catatan: text }, id);
  toast('Note tersimpan.');
}
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'per-from' || t.id === 'per-to') setPeriode($('per-from').value, $('per-to').value);
  else if (t.dataset && t.dataset.paydate) { if (t.value) put('payments', { tanggal: t.value }, t.dataset.paydate).then(() => toast('Tanggal bayar diperbarui.')).catch(fail); }
  else if (t.dataset && t.dataset.status) setStatus(t.dataset.status, t.value).catch(fail);
  else if (t.dataset && t.dataset.note) setNote(t.dataset.note, t.value.trim()).catch(fail);
});
document.addEventListener('focusout', ev => {
  if (pending && ev.target.matches && ev.target.matches('input.note')){ pending = false; setTimeout(render, 0); }
});

/* ---------- events ---------- */
let armed = null;
document.addEventListener('click', async ev => {
  const tb = ev.target.closest('#tabs button');
  if (tb){ tab = tb.dataset.tab; try { history.replaceState(null, '', '#' + tab); } catch (e) {} return render(); }
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'open-order' && ev.target.closest('select,input')) return;
  if (el.dataset.confirm && armed !== el){ armed = el; el.dataset.label = el.textContent; el.textContent = el.dataset.confirm; setTimeout(() => { if (armed === el){ armed = null; if (el.isConnected) el.textContent = el.dataset.label; } }, 4000); return; }
  armed = null;
  try {
    if (act === 'close') closeDlg();
    else if (act === 'per') {
      const n = new Date(), p = el.dataset.p;
      if (p === 'bulan') setPeriode(iso(new Date(n.getFullYear(), n.getMonth(), 1)), iso(new Date(n.getFullYear(), n.getMonth() + 1, 0)));
      else if (p === 'lalu') setPeriode(iso(new Date(n.getFullYear(), n.getMonth() - 1, 1)), iso(new Date(n.getFullYear(), n.getMonth(), 0)));
      else { const all = S.orders.map(o => o.tanggal).concat(S.payments.map(x => x.tanggal)).sort(); setPeriode(all[0] || today(), all.length && all[all.length - 1] > today() ? all[all.length - 1] : today()); }
    }
    else if (act === 'logout') { await sb.auth.signOut(); location.reload(); }
    else if (act === 'new-order') S.products.length ? orderForm() : productForm();
    else if (act === 'new-product') productForm();
    else if (act === 'edit-product') productForm(S.products.find(p => p.id === id));
    else if (act === 'stock-in') stockForm();
    else if (act === 'toko') tokoForm();
    else if (act === 'edit-customer') customerForm(S.customers.find(c => c.id === id));
    else if (act === 'add-item') { $('o-items').insertAdjacentHTML('beforeend', itemRow(document.querySelectorAll('#o-items .item').length)); }
    else if (act === 'rm-item') { if (document.querySelectorAll('#o-items .item').length > 1) el.closest('.item').remove(); recalcForm(); }
    else if (act === 'open-order') { openOrder = id; const o = calc(S, today()).orders.find(x => x.id === id); if (o) openDlg(orderDetail(o)); }
    else if (act === 'pdf') await savePdf(calc(S, today()).orders.find(x => x.id === id));
    else if (act === 'del-pay') { const p = S.payments.find(x => x.id === id); await del('payments', id); if (p) await clearStatus(p.orderId); }
    else if (act === 'del-stockin') await del('stockin', id);
    else if (act === 'del-order') { const ps = S.payments.filter(p => p.orderId === id).map(p => p.id); closeDlg(); for (const p of ps) await del('payments', p); await del('orders', id); toast('Order dihapus. Stok dikembalikan.'); }
    else if (act === 'wipe-contoh') { for (const c of COLS) for (const r of S[c].filter(x => x.contoh)) await del(c, r.id); toast('Data contoh dihapus.'); }
  } catch (e) { fail(e); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.matches('tr.click')) ev.target.click(); });
document.addEventListener('input', ev => { if (ev.target.closest('#o-items')) recalcForm(); });
document.addEventListener('change', ev => {
  const sel = ev.target.closest('#o-items select'); if (!sel) return;
  const p = S.products.find(x => x.id === sel.value); if (p) sel.closest('.item').querySelector('[data-k="harga"]').value = p.harga; recalcForm();
});
document.addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = ev.target, btn = f.querySelector('button.primary'); if (btn.disabled) return; btn.disabled = true;
  try {
    if (f.id === 'f-login') {
      $('login-msg').textContent = '';
      const r = await sb.auth.signInWithPassword({ email: $('l-email').value.trim(), password: $('l-pass').value });
      if (r.error) $('login-msg').textContent = 'Email atau password salah.'; else await enter();
    }
    else if (f.id === 'f-order') await saveOrder();
    else if (f.id === 'f-pay') {
      const o = calc(S, today()).orders.find(x => x.id === f.dataset.id), jumlah = Math.round(parseFloat($('p-jml').value) || 0);
      if (o && jumlah > 0) { await put('payments', { orderId: o.id, tanggal: $('p-tgl').value, jumlah, jenis: jenisBayar(o.dibayar, o.sisa, jumlah), metode: $('p-metode').value }); await clearStatus(o.id); toast('Pembayaran ' + rp(jumlah) + ' tercatat.'); }
    }
    else if (f.id === 'f-product') {
      const old = S.products.find(p => p.id === f.dataset.id);
      const data = Object.assign(old ? strip(old) : {}, { nama: $('pr-nama').value.trim(), harga: Math.round(parseFloat($('pr-harga').value) || 0), minStok: parseFloat($('pr-min').value) || 0 });
      const pid = await put('products', data, old ? old.id : undefined);
      const awal = $('pr-awal') ? parseFloat($('pr-awal').value) || 0 : 0;
      if (awal > 0) await put('stockin', { productId: pid, tanggal: today(), qty: awal, catatan: 'Stok awal' });
      closeDlg(); toast('Produk tersimpan.');
    }
    else if (f.id === 'f-stock') { await put('stockin', { productId: $('s-prod').value, tanggal: $('s-tgl').value, qty: parseFloat($('s-qty').value) || 0, catatan: $('s-cat').value.trim() || 'Barang masuk' }); closeDlg(); toast('Stok bertambah.'); }
    else if (f.id === 'f-customer') { const c = S.customers.find(x => x.id === f.dataset.id); await put('customers', Object.assign(strip(c), { nama: $('c-nama').value.trim(), telp: $('c-telp').value.trim() }), c.id); closeDlg(); toast('Customer tersimpan.'); }
    else if (f.id === 'f-toko') { toko = { nama: $('t-nama').value.trim(), alamat: $('t-alamat').value.trim(), bayar: $('t-bayar').value.trim() }; const r = await sb.from('settings').upsert(Object.assign({ id: 'toko' }, toko)); if (r.error) throw r.error; closeDlg(); toast('Data toko tersimpan.'); }
  } catch (e) { fail(e); }
  if (btn.isConnected) btn.disabled = false;
});

/* ---------- start ---------- */
async function enter(){
  $('login').hidden = true; $('app').hidden = false;
  try { await loadAll(); }
  catch (e) { $('view').innerHTML = '<div class="tablebox"><div class="empty">Data tidak bisa dimuat: ' + esc(e.message || '') + '<br>Pastikan schema.sql sudah dijalankan di Supabase.</div></div>'; }
}
(async function start(){
  const h = location.hash.slice(1); if (['ringkasan', 'order', 'stok', 'customer'].includes(h)) tab = h;
  if (!window.supabase || SUPABASE_URL.indexOf('ISI_') === 0){
    $('login').hidden = false; $('f-login').hidden = true;
    $('login-msg').textContent = window.supabase ? 'Supabase belum dihubungkan. Isi SUPABASE_URL dan SUPABASE_ANON_KEY di file index.html.' : 'Library Supabase gagal dimuat. Cek koneksi internet lalu muat ulang.';
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data } = await sb.auth.getSession();
  if (data && data.session) enter(); else $('login').hidden = false;
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && ready && !$('dlg').open && !typing('input,select,textarea')) loadAll().catch(() => {});
  });
})();
</script>
